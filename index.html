<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <title>ساحة القتال | FPS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game">
    <div id="hud" aria-live="polite">
      <div class="stat"><span>❤️ الصحة</span><b id="health">100</b></div>
      <div class="stat"><span>الموجة</span><b id="wave">1</b></div>
      <div class="stat"><span>النقاط</span><b id="score">0</b></div>
      <div class="stat ammo"><span>الذخيرة</span><b id="ammo">12 / 12</b></div>
    </div>
    <div id="crosshair"><i></i><i></i></div>
    <div id="toast" aria-live="polite"></div>
    <div id="controls">
      <div id="joystick" aria-label="تحريك اللاعب"><div id="stick"></div></div>
      <button id="reload" class="control" type="button">إعادة<br>تلقيم</button>
      <button id="fire" class="control fire" type="button">إطلاق</button>
      <p class="hint">حرّك العصا للمشي • اسحب يمين الشاشة للتصويب</p>
    </div>
    <section id="overlay" class="overlay">
      <div class="card">
        <p class="eyebrow">لعبة تصويب ثلاثية الأبعاد</p>
        <h1 id="title">ساحة القتال</h1>
        <p id="message">اصمد أمام موجات الأعداء. حرّك بالعصا، واسحب يمين الشاشة للتصويب، واضغط إطلاق.</p>
        <button id="start" type="button">ابدأ اللعب</button>
      </div>
    </section>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
